# Servicios de respaldo para desarrollo LOCAL del backend.
# La infraestructura de despliegue (Traefik, imágenes publicadas) vive en el
# repo de infra, igual que en el sistema anterior.
#
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ruta
      POSTGRES_PASSWORD: ruta
      POSTGRES_DB: ruta
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruta -d ruta']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
