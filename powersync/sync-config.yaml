# Sync Rules — QUÉ datos bajan a cada dispositivo de campo (y por tanto qué está
# disponible offline). Se escriben como SQL sobre las colecciones Mongo; PowerSync
# las trata como tablas. Regla dura de PowerSync: cada fila necesita una columna
# `id` de UNA sola columna → en Mongo se proyecta `_id as id`.
#
# ⚠️ ANDAMIAJE: las colecciones de campo (asistencia, progresión, diagnóstico)
# TODAVÍA NO existen en be_ruta. Este archivo deja definidas las superficies
# offline acordadas para que, al crearlas, el sync ya esté cableado. Ajusta los
# nombres de colección/campo cuando exista el modelo `programa`.
#
# Formato: `bucket_definitions` (estable). Alternativa moderna: `streams`
# (config.edition: 3) — confirma cuál soporta tu tag de imagen.

bucket_definitions:
  # ── Referencia global: catálogos iguales para todos (solo lectura) ──────────
  referencia_global:
    data:
      - SELECT _id as id, * FROM cargos
      # - SELECT _id as id, * FROM catalogo_objetivos   # cuando exista

  # ── Datos de la(s) unidad(es) del dirigente autenticado ─────────────────────
  # request.user_id() = claim `sub` del JWT = _id del usuario en be_ruta.
  # El parámetro acota el bucket a la unidad del dirigente; así cada quien baja
  # SOLO su unidad (scope + tamaño). Lectura del roster + captura de campo.
  unidad_del_dirigente:
    parameters:
      - SELECT id_unidad FROM users
        WHERE _id = request.user_id() AND id_unidad IS NOT NULL
    data:
      # Roster de la unidad (lectura offline: ficha/historial del protagonista)
      - SELECT _id as id, * FROM users WHERE id_unidad = bucket.id_unidad
      # Captura de campo (lectura + escritura offline):
      - SELECT _id as id, * FROM asistencia   WHERE id_unidad = bucket.id_unidad
      - SELECT _id as id, * FROM progresion   WHERE id_unidad = bucket.id_unidad
      - SELECT _id as id, * FROM diagnostico  WHERE id_unidad = bucket.id_unidad
